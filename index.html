<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledge</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="rail" data-tauri-drag-region>
      <div class="rail-orb">
        <button class="orb" id="orb" aria-label="Ledge status">
          <span class="orb-halo"></span>
          <span class="orb-arc"></span>
          <svg class="orb-mark" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 47 43 20" />
            <circle cx="43" cy="20" r="6" />
          </svg>
        </button>
      </div>

      <div class="nodes" id="nodes" data-tauri-drag-region></div>

      <button class="settings" id="settings" aria-label="Ledge settings"><span></span></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
