[package]
name = "ledge"
version = "0.2.0"
description = "Your agents, at a glance."
authors = ["smokey18"]
edition = "2021"
license = "MIT"
repository = "https://github.com/smokey18/Ledge"
default-run = "ledge"

[lib]
name = "ledge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ledge-hook"
path = "src/bin/hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
tauri-plugin-autostart = "2.5.1"
window-vibrancy = "0.8.0"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder"] }
